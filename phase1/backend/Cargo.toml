[package]
name = "hauntmaster-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.6", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
tower-http = { version = "0.4", features = ["cors", "fs"] }  # ← ADD "fs"
glob = "0.3"
